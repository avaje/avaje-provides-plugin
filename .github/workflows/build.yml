name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        java_version: [24]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'zulu'

      - name: Maven cache
        uses: actions/cache@v5
        env:
          cache-name: maven-cache
        with:
          path: ~/.m2
          key: build-${{ env.cache-name }}

      - name: Gradle cache
        uses: actions/cache@v5
        env:
          cache-name: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: build-${{ env.cache-name }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: build-${{ env.cache-name }}-

      # Build and install the Maven plugin so it's available in the local repo
      # for the Maven blackbox tests in avaje-provides-plugin-test
      - name: Build and install Maven plugin
        run: mvn install --no-transfer-progress
        working-directory: avaje-provides-maven-plugin

      # Run the Maven blackbox tests (compiles and runs Maven*Test classes only;
      # Gradle-specific tests are excluded in the pom.xml)
      - name: Run Maven blackbox tests
        run: mvn test --no-transfer-progress
        working-directory: avaje-provides-plugin-test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      # Runs both Gradle and Maven blackbox tests.
      # The Gradle plugin is built automatically via the includeBuild in settings.gradle.kts.
      # The Maven plugin is resolved from the local Maven repo installed above.
      - name: Run blackbox tests
        run: gradle test --info --stacktrace
        working-directory: avaje-provides-plugin-test
